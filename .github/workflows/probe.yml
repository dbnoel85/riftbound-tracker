name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for L in en-us zh-cn zh-tw ja-jp ko-kr fr-fr de-de es-es it-it pt-br; do
            curl -sL -A "Mozilla/5.0" "https://playriftbound.com/$L/card-gallery/" -o $L.html; echo "== $L $(wc -c < $L.html)"
          done
          python3 - <<'PY'
          import re,json
          def cards(L):
              try: h=open(L+'.html',encoding='utf-8',errors='ignore').read()
              except: return {}
              m=re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>',h,re.S)
              if not m: return {}
              d=json.loads(m.group(1)); out={}
              for b in d['props']['pageProps']['page'].get('blades',[]):
                  for c in (b.get('cards') or {}).get('items',[]) if isinstance(b.get('cards'),dict) else []:
                      out[c['id']]=c
              return out
          en=cards('en-us'); print('en',len(en))
          k0=next(iter(en)); print('keys',list(en[k0].keys())); print('img', en[k0].get('cardImage',{}).get('url'))
          for L in ['zh-cn','zh-tw','ja-jp','ko-kr','fr-fr','de-de','es-es','it-it','pt-br']:
              c=cards(L)
              if not c: print(L,'none'); continue
              same=sum(1 for i in c if i in en and c[i].get('cardImage',{}).get('url')==en[i].get('cardImage',{}).get('url'))
              diff=[i for i in c if i in en and c[i].get('cardImage',{}).get('url')!=en[i].get('cardImage',{}).get('url')]
              print(L,len(c),'same',same,'diff',len(diff), 'only-here',len(set(c)-set(en)))
              for i in diff[:2]: print('  ',i, en[i]['cardImage']['url'][:110],'|',c[i]['cardImage']['url'][:110], '|', c[i].get('name'))
          print([ (i,en[i]['publicCode']) for i in list(en)[:5]])
          import collections; print(collections.Counter(c['set']['value']['id'] for c in en.values()))
          PY
