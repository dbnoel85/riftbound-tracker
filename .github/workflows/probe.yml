name: probe
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, re
          def get(u):
              r = urllib.request.Request(u, headers={"User-Agent": "riftbound-tracker"}); return urllib.request.urlopen(r, timeout=30).read()
          for u in ["https://playriftbound.com/en-us/news/announcements/radiance-errata-updates/", "https://playriftbound.com/en-us/news/rules-and-releases/unleashed-errata-updates/"]:
              h = get(u).decode("utf8", "ignore")
              blocks = re.findall(r'id="rich-text-html">(.*?)</div></div></div>', h, re.S)
              big = max(blocks, key=len) if blocks else ""
              print("HTML", u, len(blocks), big[:3000].replace("\n", " "))
          PY
