name: probe
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, re
          def get(u, ua="Mozilla/5.0 (riftbound-tracker)"):
              r = urllib.request.Request(u, headers={"User-Agent": ua}); return urllib.request.urlopen(r, timeout=30).read()
          for u in ["https://locator.riftbound.uvsgames.com/events/1227032", "https://locator.riftbound.uvsgames.com/robots.txt"]:
              try:
                  h = get(u).decode("utf8", "ignore")
                  print("UVS", u, len(h), sorted(set(re.findall(r'https?://[a-z0-9.-]*(?:api|uvsgames|carde)[a-z0-9./_-]*', h)))[:25])
                  print("UVSTXT", re.sub(r"\s+", " ", h[:1200]))
              except Exception as e: print("UVS FAIL", u, e)
          for u in ["https://topdeck.gg/robots.txt", "https://topdeck.gg/docs/tournaments-v2"]:
              try: print("TD", u, re.sub(r"\s+", " ", get(u).decode("utf8","ignore")[:800]))
              except Exception as e: print("TD FAIL", u, e)
          PY
