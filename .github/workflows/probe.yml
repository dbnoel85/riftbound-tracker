name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL -A "Mozilla/5.0" "https://playriftbound.com/en-us/events/" -o ev.html
          grep -oE 'https://events.playriftbound.com/_next/static/chunks/[a-z0-9_-]+\.js' ev.html | sort -u > js.txt
          mkdir js; i=0; for u in $(cat js.txt); do i=$((i+1)); curl -s "$u" -o js/$i.js; done
          python3 - <<'PY'
          import re,glob
          src=''.join(open(f,encoding='utf-8',errors='ignore').read() for f in glob.glob('js/*.js'))
          i=src.find('CompeteTournamentSearch')
          for m in re.finditer(r'competeTournamentSearch|CompeteTournamentSearch',src):
              pass
          for m in re.finditer(r'.{700}(filter:\{|filter:)[^`]{0,40}(location|latitude|distance|radius|geo).{500}',src):
              print('FILT>>',m.group(0)[:1300]); print()
          for m in re.finditer(r'.{300}searchParams\.get\("l"\).{300}',src): print('L>>',m.group(0))
          for m in re.finditer(r'.{200}searchParams\.get\("q"\).{200}',src): print('Q>>',m.group(0))
          PY
          echo "== CORS"
          curl -s -i -X OPTIONS https://events.playriftbound.com/api/gql -H "Origin: https://dbnoel85.github.io" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" | head -20
