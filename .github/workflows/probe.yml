name: probe
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, re
          def get(u, ua="Mozilla/5.0 (riftbound-tracker)"):
              r = urllib.request.Request(u, headers={"User-Agent": ua}); return urllib.request.urlopen(r, timeout=30).read()
          print("ROBOTS", get("https://riftdecks.com/robots.txt").decode()[:1500].replace("\n", " | "))
          h = get("https://riftdecks.com/stats/winrate").decode("utf8", "ignore")
          i = h.find("<table"); print("TABLE", re.sub(r"\s+", " ", h[i:i+4000]))
          for k in ["terms", "tos"]:
              m = re.findall(r'href="([^"]*%s[^"]*)"' % k, h); print("TERMSLINK", k, m[:3])
          PY
