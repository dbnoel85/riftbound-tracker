name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL -A "Mozilla/5.0" "https://playriftbound.com/en-us/events/" -o ev.html
          grep -oE 'https://events.playriftbound.com/_next/static/chunks/[a-z0-9_-]+\.js' ev.html | sort -u > js.txt
          mkdir js; i=0; for u in $(cat js.txt); do i=$((i+1)); curl -s "$u" -o js/$i.js; done
          python3 - <<'PY'
          import re,glob
          src=''.join(open(f,encoding='utf-8',errors='ignore').read() for f in glob.glob('js/*.js'))
          qs=re.findall(r'(query\s+\w+\([^`]{0,1500}?`)',src)
          for q in qs:
              if 'atitude' in q or 'vent' in q[:80]: print('QUERY>>',q[:1400].replace('\\n','\n')); print()
          for m in re.finditer(r'.{200}api/gql.{300}',src): print('GQLCTX>>',m.group(0)); 
          for m in re.finditer(r'.{150}searchParams.{0,20}(get|set)\("(lat|lng|location|postal|zip|q|distance|radius)[^"]*"\).{100}',src): print('SP>>',m.group(0)[:400])
          print(sorted(set(re.findall(r'searchParams\.(?:get|set|has)\("([^"]+)"',src))))
          PY
