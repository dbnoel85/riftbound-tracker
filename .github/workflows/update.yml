name: Update prices and publish app

on:
  schedule:
    # Every day at 21:30 UTC (~3:30 pm Central), after tcgcsv's daily refresh at ~20:00 UTC
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-pull prices even if the source hasn't changed"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow py7zr numpy opencv-python-headless
      - name: Pull Riftbound catalog and prices
        env:
          FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '1' || '' }}
        run: python scripts/update_prices.py
      - name: Pull meta decks
        continue-on-error: true
        run: python scripts/update_decks.py
      - name: Keyword glossary
        continue-on-error: true
        run: python scripts/build_glossary.py
      - name: Ban list announcements
        continue-on-error: true
        run: python scripts/update_bans.py
      - name: Scanner reference images (new cards only)
        continue-on-error: true
        timeout-minutes: 30
        run: python scripts/update_scan.py
      - name: Price history (chart)
        continue-on-error: true
        timeout-minutes: 60
        run: python scripts/update_history.py
      - name: Save new data
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets scan-src
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Prices $(date -u +%F)"
            git push
          fi

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
