name: bantest
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL -A "riftbound-tracker" "https://playriftbound.com/en-us/news/announcements/radiance-ban-list-updates-effective-november-23-2026/" -o a.html
          python3 - <<'PY'
          import re
          s=open('a.html').read()
          for m in list(re.finditer(r'Riven', s))[:6]:
              print('---', repr(s[max(0,m.start()-200):m.start()+120]))
          PY
