name: bantest
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: |
          python - <<'PY'
          import json; b=json.load(open('data/bans.json')); b['announcements']=b['announcements'][1:]; json.dump(b,open('data/bans.json','w'))
          PY
          python scripts/update_bans.py
          python -c "import json;print(json.dumps(json.load(open('data/bans.json'))['announcements'][0],indent=1))"
